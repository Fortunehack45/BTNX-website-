<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>BTNX Store — Admin Studio &amp; Client Care Desk</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("btnx_theme") || localStorage.getItem("btnx_theme_preference");
          var isDark =
            pref === "dark" ||
            ((!pref || pref === "system") &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add("dark");
            root.style.colorScheme = "dark";
            root.style.backgroundColor = "#111110";
          } else {
            root.classList.remove("dark");
            root.style.colorScheme = "light";
            root.style.backgroundColor = "#FAF9F7";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FAF9F7] dark:bg-[#111110] text-[#141413] dark:text-[#F3F1EC] antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
